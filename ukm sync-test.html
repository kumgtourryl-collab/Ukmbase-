<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UkmSync Test</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; padding: 24px; background: #0B1020; color: #F8FAFC; max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 8px; }
input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #2A3347; background: #1C2333; color: #F8FAFC; font-size: 14px; }
button { background: #4F46E5; border: none; cursor: pointer; font-weight: 700; }
button:hover { background: #4338CA; }
.todo { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #2A3347; border-radius: 8px; margin-top: 8px; background: #1C2333; }
.status { padding: 12px; border-radius: 8px; background: #1C2333; margin: 16px 0; font-size: 12px; font-family: 'JetBrains Mono', monospace; line-height: 1.6; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.online { background: #10B981; }
.offline { background: #EF4444; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge-linked { background: rgba(16,185,129,0.15); color: #10B981; }
.badge-notlinked { background: rgba(245,158,11,0.15); color: #F59E0B; }
</style>
</head>
<body>
  <h1>UkmSync Test — todos</h1>
  <div class="status" id="status">Loading...</div>

  <div style="display: flex; gap: 8px; margin-bottom: 16px;">
    <input type="text" id="new-todo" placeholder="What needs doing?" style="flex: 1;" onkeydown="if(event.key==='Enter')addTodo()">
    <button onclick="addTodo()">Add</button>
  </div>

  <div id="todos"></div>

  <div style="margin-top: 24px; display: flex; gap: 8px;">
    <button onclick="UkmSync.sync()" style="flex: 1;">Sync now</button>
    <button onclick="UkmSync.clearQueue()" style="flex: 1; background: #EF4444;">Clear queue</button>
  </div>

  <div style="margin-top: 16px; padding: 12px; background: #1C2333; border-radius: 8px; font-size: 12px; color: #94A3B8; line-height: 1.6;">
    <strong style="color:#F8FAFC;">How to test:</strong><br>
    1. Add a todo → it syncs instantly<br>
    2. Turn on <strong>airplane mode</strong> → add more todos (they queue locally)<br>
    3. Turn airplane mode off → watch them sync automatically<br>
    4. Open the Ukmbase dashboard → UkmSync tab → see the activity log
  </div>

  <script src="ukmsync.js"
          data-ukm-project="test-app"
          data-ukm-backend-url="https://ukmsync-server.onrender.com"
          data-ukm-supabase-url="https://dwjyzqsrzdgnpwibnyjn.supabase.co"
          data-ukm-anon-key="sb_publishable_4vcPyg62OqmfwNaHxx0CGA_a7O0_NJV"
          data-ukm-enabled="true"
          data-ukm-strategy="last-write-wins"
          data-ukm-poll-ms="5000"
          defer></script>

  <script>
    function renderStatus() {
      if (typeof UkmSync === 'undefined') {
        document.getElementById('status').textContent = 'UkmSync not loaded yet...';
        return;
      }
      var s = UkmSync.status();
      var onlineDot = s.online
        ? '<span class="dot online"></span>Online'
        : '<span class="dot offline"></span>Offline';
      var badge = s.backendLinked
        ? '<span class="badge badge-linked">Backend linked</span>'
        : '<span class="badge badge-notlinked">Backend offline</span>';
      document.getElementById('status').innerHTML =
        onlineDot + ' &middot; ' + badge + '<br>' +
        'Queue: <strong>' + s.queueLength + '</strong> &middot; ' +
        'Syncing: ' + (s.syncing ? 'yes' : 'no') +
        (s.lastSyncAt ? ' &middot; Last: ' + new Date(s.lastSyncAt).toLocaleTimeString() : '') +
        '<br>' +
        'Client: <span style="color:#64748B;">' + s.clientId + '</span>' +
        (s.projectId ? '<br>Project ID: <span style="color:#64748B;">' + s.projectId + '</span>' : '');
    }

    async function renderTodos() {
      if (typeof UkmSync === 'undefined') return;
      try {
        var todos = await UkmSync.select('todos', { order: 'created_at.desc', limit: 50 });
        var el = document.getElementById('todos');
        if (!todos || todos.length === 0) {
          el.innerHTML = '<p style="color:#64748B;">No todos yet.</p>';
          return;
        }
        el.innerHTML = todos.map(function (t) {
          return '<div class="todo">' +
            '<span>' + escapeHtml(t.title || '(untitled)') + '</span>' +
            '<button style="background:#EF4444;padding:6px 12px;font-size:12px;" onclick="removeTodo(\'' + t.id + '\')">×</button>' +
            '</div>';
        }).join('');
      } catch (e) {
        console.warn('renderTodos error:', e.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function addTodo() {
      var input = document.getElementById('new-todo');
      var title = input.value.trim();
      if (!title) return;
      input.value = '';
      await UkmSync.insert('todos', { title: title });
      setTimeout(renderTodos, 300);
    }

    async function removeTodo(id) {
      await UkmSync.remove('todos', id);
      setTimeout(renderTodos, 300);
    }

    // Wait for UkmSync to boot
    function init() {
      if (typeof UkmSync === 'undefined') {
        setTimeout(init, 200);
        return;
      }
      UkmSync.onStatusChange(renderStatus);
      renderTodos();
      setInterval(renderTodos, 5000);
    }
    init();
  </script>
</body>
</html>
